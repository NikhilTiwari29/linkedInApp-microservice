spring.application.name: api-gateway

server.port: 8080
eureka.client.service-url.defaultZone: http://discovery-server:8761/eureka

jwt.secretKey: ${JWT_SECRET_KEY:change-this-dev-secret-key-min-32-chars-long!!}

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URI:lb://USER-SERVICE}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=2

        - id: posts-service
          uri: ${POSTS_SERVICE_URI:lb://POSTS-SERVICE}
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: connections-service
          uri: ${CONNECTIONS_SERVICE_URI:lb://CONNECTIONS-SERVICE}
          predicates:
            - Path=/api/v1/connections/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:lb://NOTIFICATION-SERVICE}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: uploader-service
          uri: ${UPLOADER_SERVICE_URI:lb://UPLOADER-SERVICE}
          predicates:
            - Path=/api/v1/uploads/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter
