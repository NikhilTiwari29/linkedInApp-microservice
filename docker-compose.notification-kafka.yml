version: "3.8" # Docker Compose file format version

services:
  kafka: # Kafka broker service. Docker Compose also registers 'kafka' as a DNS hostname in this network.
    image: docker.io/bitnami/kafka:3.8 # Kafka image from Bitnami
    container_name: kafka # Fixed container name for easier identification
    volumes:
      - "kafka_data:/bitnami" # Mount named volume kafka_data to /bitnami inside the container
    networks:
      - linkedin-network # Attach Kafka to the custom network so other services can reach it by name
    environment:
      # KRaft mode: Kafka runs without ZooKeeper
      - KAFKA_CFG_NODE_ID=0 # Unique ID for this Kafka node
      - KAFKA_CFG_PROCESS_ROLES=controller,broker # This node acts as both controller and broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093 # Controller voter list; kafka is the DNS hostname here

      # Listener configuration
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 # Kafka listens on 9092 for clients and 9093 for controller traffic
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://:9092 # Address Kafka advertises to clients
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT # Map listeners to security protocols
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER # Controller communication uses the CONTROLLER listener
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT # Broker-to-broker communication uses PLAINTEXT

  kafbat-ui: # Kafka UI service. Docker Compose also registers 'kafbat-ui' as a DNS hostname in this network.
    container_name: kafbat-ui # Fixed container name for the UI
    image: ghcr.io/kafbat/kafka-ui:latest # Kafka UI image
    ports:
      - 8090:8080 # Host port 8090 maps to container port 8080
    depends_on:
      - kafka # Start Kafka before starting the UI
    networks:
      - linkedin-network # Same network so the UI can resolve kafka:9092
    environment:
      KAFKA_CLUSTERS_0_NAME: local # Cluster name shown in the UI
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092 # Kafka UI connects using Docker DNS hostname kafka
      # Remove this unless you are actually running KSQLDB
      # KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb0:8088

  notification-db: # PostgreSQL database for the notification service. DNS hostname is notification-db.
    image: postgres # Official PostgreSQL image
    container_name: notification-db # Fixed container name
    environment:
      - POSTGRES_DB=notificationDB # Database created on startup
      - POSTGRES_USER=user # PostgreSQL username
      - POSTGRES_PASSWORD=password # PostgreSQL password
    networks:
      - linkedin-network # Same network so other containers can resolve notification-db
    volumes:
      - notification-db-data:/var/lib/postgresql/data # Persist PostgreSQL data outside the container

  notification-service: # Spring Boot notification microservice. DNS hostname is notification-service.
    image: nikhiltiwarip29/linkedin-app/notification-service # Your Docker image for the service
    container_name: notification-service # Fixed container name
    networks:
      - linkedin-network # Allows it to talk to Kafka and PostgreSQL using service names
    depends_on:
      - notification-db # Start database first
      - kafka # Start Kafka first

networks:
  linkedin-network: # Custom bridge network shared by all services
    driver: bridge

volumes:
  kafka_data: # Named volume for Kafka data persistence
  notification-db-data: # Named volume for PostgreSQL data persistence
  posts-db-data: # Reserved for future posts service
  user-db-data: # Reserved for future user service
  connections-db-data: # Reserved for future connections service
